submission:
  title: "Fleet360"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Supply chain operators must manage shipments, vehicles, routes, and
    delivery commitments while disruptions such as weather events, port
    strikes, and geopolitical crises can rapidly affect active shipments.
    Today, critical information such as vehicle location, route conditions,
    fleet availability, and cold-chain sensor readings can require operators
    to manually connect multiple signals to decide what action to take,
    increasing delays, inefficient fleet utilisation, and the risk of
    temperature-sensitive cargo loss.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Fleet 360 is an AI-powered fleet and supply chain operations platform that
    combines real-time fleet visibility with specialized disruption and
    monitoring agents. It identifies affected shipments, recommends
    traffic-aware rerouting or carrier alternatives, finds suitable idle
    assets for redeployment, detects cold-chain temperature excursions, and
    delivers actionable alerts to operators and drivers.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-time GPS tracking with 15-second updates, geofencing, and live vehicle visibility"
    - "Traffic-aware route optimization using vehicle capacity and delivery time windows"
    - "AI disruption agents that analyze weather and geopolitical events to identify affected shipments and recommend recovery actions"
    - "Fleet utilization intelligence that identifies suitable idle assets for redeployment to disrupted shipments"
    - "Cold-chain IoT monitoring that detects temperature excursions, classifies severity, and triggers operator or driver alerts"

  tech_stack:
    languages: []                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: []                     # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Fleet 360 combines real-time fleet visibility with AI-driven exception
    handling. Instead of only showing where vehicles are, the platform
    connects disruptions, shipment requirements, fleet availability, routes,
    and cold-chain conditions to determine what requires attention and
    recommend the next practical action.


  known_limitations: >                 # Optional but recommended — be honest about gaps
    The hackathon prototype uses simulated disruption, shipment, and
    cold-chain sensor inputs where live external feeds are unavailable.
    Production deployment would require integration with enterprise
    transportation systems, carrier networks, live IoT devices, and validated
    regulatory rules for specific cargo types.

